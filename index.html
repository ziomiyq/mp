<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>LET OUT — World</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="login">
    <div class="panel">
      <h1>LET OUT</h1>
      <p>Enter your username to enter the world.</p>
      <input id="username" maxlength="18" placeholder="Username" autocomplete="off">
      <button id="join">ENTER WORLD</button>
      <small id="setupHint">Add your Supabase keys in src/config.js first.</small>
    </div>
  </div>

  <div id="gameUI" hidden>
    <div id="online">🟢 <span id="onlineCount">0</span> ONLINE</div>
    <div id="you"></div>
    <canvas id="game"></canvas>
    <div id="joystick" aria-label="Movement joystick">
      <div id="stick"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./src/config.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
